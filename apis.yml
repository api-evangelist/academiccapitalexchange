aid: academiccapitalexchange
name: Academic Capital Exchange
description: >-
  Academic Capital Exchange (ACE) was a Chicago, Illinois online peer-to-peer student loan
  marketplace founded in 2008 by Shawn Bercuson, built to link students to the financial
  support and professional guidance needed to succeed in the classroom and beyond by matching
  student borrowers directly with individual lenders rather than routing them through a bank
  or a federal loan servicer. It followed CapAlly, an earlier peer-to-peer student lending
  marketplace and social network the same founder started in 2007 and sold before taking it to
  market. ACE was a consumer-facing lending marketplace, not a developer platform: it never
  operated a developer portal, never published a machine-readable API contract, and never
  shipped client SDKs, and no GitHub organization under the company name exists. The company is
  no longer operating. Its host academiccapitalexchange.com is not merely offline but entirely
  unregistered — whois returns "No match" and DNS returns NXDOMAIN for the .com, .net, .co and
  .io labels — and the Internet Archive holds a single snapshot of the site, from February 2008.
  The only surviving public record of the company is a secondary-market listing page on
  EquityZen, which is a trading venue and not the company's own web presence, so it is
  deliberately not wired as a Website pointer. This profile is retained as a historical record;
  there is no API surface to enrich.
